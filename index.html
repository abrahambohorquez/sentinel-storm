async function descifrar(clave){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)); const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(clave.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(CIFRADO.salt), iterations: 200000, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(CIFRADO.iv)}, key, b64(CIFRADO.ct));
  return new TextDecoder().decode(pt); }
async function entrar(){
  const v = document.getElementById("clave").value.trim().toUpperCase(); if(!v) return;
  document.getElementById("err").textContent = ""; document.getElementById("entrar").textContent = "Opening";
  try { const pagina = await descifrar(v); try { sessionStorage.setItem("sentinel_clave", v); } catch(e) {}
    document.open(); document.write(pagina); document.close(); }
  catch(e) { document.getElementById("err").textContent = "That code did not open the page."; document.getElementById("entrar").textContent = "Open"; } }
document.getElementById("entrar").onclick = entrar;
document.getElementById("clave").addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
try { const g = sessionStorage.getItem("sentinel_clave"); if(g){ document.getElementById("clave").value = g; entrar(); } } catch(e) {}
</script>
